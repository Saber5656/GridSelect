<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GridSelect Browser Plain Text Fixture</title>
  <style>
    body {
      margin: 24px;
      font: 14px Menlo, Consolas, "Courier New", monospace;
      color: #111;
      background: #fff;
    }

    textarea,
    pre {
      box-sizing: border-box;
      width: 52ch;
      margin: 0 0 24px;
      padding: 12px;
      border: 1px solid #999;
      font: inherit;
      line-height: 1.4;
      white-space: pre;
      overflow: auto;
      tab-size: 4;
    }

    textarea {
      height: 11em;
      resize: none;
    }
  </style>
</head>
<body>
  <textarea spellcheck="false" wrap="off" aria-label="GridSelect browser plain text fixture">SKU       Jan   Feb   Mar   Apr
GS-100    032   041   044   052
GS-200    018   022   027   033
GS-300    075   080   083   091
GS-400    006   010   012   015</textarea>

  <pre aria-label="GridSelect browser preformatted text fixture">SKU       Jan   Feb   Mar   Apr
GS-100    032   041   044   052
GS-200    018   022   027   033
GS-300    075   080   083   091
GS-400    006   010   012   015</pre>
</body>
</html>
